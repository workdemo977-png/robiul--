  <text x="60" y="45" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Project Blueprint: High-DA Profile Link Architecture</text>
  <rect x="365" y="30" width="100" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
