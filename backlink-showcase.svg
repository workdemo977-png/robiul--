      <path d="M 8 12 L 11 15 L 17 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Zero Spam Score Check</text>
