    <text x="30" y="74" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="9">Manual Web 2.0 &amp; Brand Profiles</text>

    <line x1="107" y1="82" x2="107" y2="98" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3"/>

    <rect x="18" y="100" width="179" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="117" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Anchor Diversification</text>
    <text x="30" y="129" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9">Brand name, URL &amp; Generic mix</text>

    <line x1="107" y1="137" x2="107" y2="153" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3"/>

    <rect x="18" y="155" width="179" height="48" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="173" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Target Landing Page</text>
    <text x="30" y="186" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9">Safe Indexation &amp; Natural Juice</text>
