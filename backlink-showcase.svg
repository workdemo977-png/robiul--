      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">100% Manual Submission</text>
    </g>

    <g transform="translate(16, 75)">
      <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 8 12 L 11 15 L 17 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Permanent Live URLs</text>
