    <rect x="16" y="180" width="183" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="107" y="197" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Complete Transparent Audit Report</text>
