      <path d="M 8 12 L 11 15 L 17 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Full Name &amp; Direct Title</text>
    </g>

    <g transform="translate(16, 75)">
      <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 8 12 L 11 15 L 17 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Business &amp; Personal Email</text>
    </g>

    <g transform="translate(16, 110)">
      <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 8 12 L 11 15 L 17 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Company Size &amp; Location</text>
    </g>

    <g transform="translate(16, 145)">
      <circle cx="12" cy="12" r="10" fill="#10b981" fill-opacity="0.2"/>
      <path d="M 8 12 L 11 15 L 17 9" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
      <text x="30" y="15" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">SMTP Ping Verification Passed</text>
    </g>

    <rect x="16" y="180" width="183" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="107" y="197" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Formatted in CSV / Google Sheets</text>
  </g>
